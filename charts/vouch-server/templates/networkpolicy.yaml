{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vouch-server.fullname" . }}
  labels:
    {{- include "vouch-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vouch-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressTo }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- toYaml $.Values.networkPolicy.egressPorts | nindent 8 }}
    {{- end }}
{{- end }}
