[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2026.6.3"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96.0"
repository = "https://github.com/vouch-sh/vouch"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
non_ascii_idents = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
# Panic-prevention lints
# See: https://blog.reverberate.org/2025/02/03/no-panic-rust.html
# See: https://github.com/trailofbits/claude-code-config/blob/main/claude-md-template.md#rust
#
# Production code must never panic. These lints enforce panic-free patterns.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

# Panic patterns inside Result-returning functions
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"

# Indexing can panic - use .get() instead
indexing_slicing = "deny"

# String slicing can panic on non-UTF8 boundaries
string_slice = "deny"

# Modulo by zero panics — use checked_rem or guard the divisor
modulo_arithmetic = "deny"

# Integer division panics on /0 — pair with modulo_arithmetic
integer_division = "deny"

# `+`, `-`, `*` panic in debug on overflow and wrap silently in release.
# Use checked_*/saturating_*/wrapping_* explicitly to declare intent.
arithmetic_side_effects = "deny"

# Numeric `as` casts silently truncate, lose sign, wrap, or lose precision.
# Pair with arithmetic_side_effects to fully close the integer-bug surface.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
checked_conversions = "deny"

# Time/Duration subtraction panics on negative result — use checked_sub or saturating_sub
unchecked_time_subtraction = "deny"

# Float equality is unreliable — use abs(a - b) < epsilon
float_cmp = "deny"
float_cmp_const = "deny"

# Lossy float literals (e.g. 16_777_217f32) silently lose precision
lossy_float_literal = "deny"

# 0.0 / 0.0 is NaN, almost always a bug
zero_divided_by_zero = "deny"

# `From` impls must be infallible — fallible conversions belong in `TryFrom`
fallible_impl_from = "deny"

# Recursive Display/Debug impls cause stack-overflow panics
recursive_format_impl = "deny"

# Stack-overflow risk
large_stack_arrays = "deny"
large_stack_frames = "deny"

# Infinite iteration / hangs
infinite_iter = "deny"

# Undefined behavior (belt-and-braces alongside unsafe_code = "deny")
mem_replace_with_uninit = "deny"
uninit_assumed_init = "deny"
uninit_vec = "deny"

# Code hygiene
dbg_macro = "deny"

# Safety
await_holding_lock = "deny"
large_futures = "deny"
mem_forget = "deny"

# Use atomics (AtomicBool, AtomicU32, ...) instead of Mutex<bool/integer>
mutex_atomic = "deny"

# Rc<String>/Arc<Vec<T>> should be Rc<str>/Arc<[T]> (cheaper, sized)
rc_buffer = "deny"

# Style: prefer .map_or(default, f) over .map(f).unwrap_or(default)
map_unwrap_or = "deny"

# Silent drops of #[must_use] (mostly Result) hide real failures
let_underscore_must_use = "deny"

# Functions over 150 LoC (threshold in .clippy.toml) need an explicit
# #[expect(..., reason)] — ratchet against monolithic functions. warn is
# enforced as deny by `make lint` (-D warnings).
too_many_lines = "warn"

module_name_repetitions = "allow"
similar_names = "allow"

allow_attributes_without_reason = "deny"
# pedantic = { level = "warn", priority = -1 }

