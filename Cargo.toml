[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"
repository = "https://github.com/vouch-sh/vouch"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Panic-prevention lints
# See: https://blog.reverberate.org/2025/02/03/no-panic-rust.html
#
# Production code must never panic. These lints enforce panic-free patterns.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

# Panic patterns inside Result-returning functions
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"

# Indexing can panic - use .get() instead
indexing_slicing = "deny"

# String slicing can panic on non-UTF8 boundaries
string_slice = "warn"

[workspace.dependencies]
# Async runtime (exact version, minimal features)
tokio = { version = "=1.49.0", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }

# CLI
clap = { version = "=4.5.54", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }

# Serialization
serde = { version = "=1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.149", default-features = false, features = ["std"] }
ciborium = { version = "=0.2.2", default-features = false }

# FIDO2 (CLI - direct device communication)
ctap-hid-fido2 = { version = "=3.5.8", default-features = false }

# WebAuthn (Server - verification only)
webauthn-rs = { version = "=0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = { version = "=0.5.4", default-features = false }

# HTTP client (CLI and Server for OIDC)
reqwest = { version = "=0.13.1", default-features = false, features = ["json", "rustls", "form"] }

# HTTP server
axum = { version = "=0.8.8", default-features = false, features = ["json", "tokio", "http1", "form", "query"] }

# Database
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }

# JWT
jsonwebtoken = { version = "=10.2.0", default-features = false, features = ["aws_lc_rs"] }

# Error handling
thiserror = { version = "=2.0.18", default-features = false }
anyhow = { version = "=1.0.100", default-features = false, features = ["std"] }

# Logging
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["std", "fmt", "env-filter"] }

# Time
jiff = { version = "=0.2.18", default-features = false, features = ["std", "serde"] }

# IDs
uuid = { version = "=1.19.0", default-features = false, features = ["v4", "v7", "serde", "std"] }

# Password input (CLI)
rpassword = { version = "=7.4.0", default-features = false }

# Interactive prompts (CLI)
inquire = { version = "=0.7.5", default-features = false, features = ["crossterm"] }

# Config paths (CLI)
dirs = { version = "=6.0.0", default-features = false }

# Browser launching (CLI)
open = { version = "=5.3.2", default-features = false }

# Crypto
rand = { version = "=0.9.2", default-features = false, features = ["std", "std_rng"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

# URL parsing
url = { version = "=2.5.8", default-features = false }
urlencoding = { version = "=2.1.3", default-features = false }

# Secrets (zeroize on drop)
secrecy = { version = "=0.10.3", default-features = false, features = ["serde"] }

# Internal
vouch-common = { path = "crates/vouch-common" }
vouch-agent = { path = "crates/vouch-agent" }

[profile.release]
strip = true      # Automatically strip symbols from the binary
lto = true        # Enable full link time optimization for better size reduction
codegen-units = 1 # Maximize size reduction optimizations
panic = "abort"   # Terminate process upon panic
opt-level = "z"   # Optimize for size (more aggressive than "s")