# Kamal 2 deployment configuration for vouch-server
# See: https://kamal-deploy.org/docs/configuration/overview/

service: vouch

image: vouch-sh/vouch

servers:
  web:
    hosts:
      - 10.0.57.30
    options:
      expose: "3000"

proxy:
  host: dev.vouch.sh
  ssl: false
  app_port: 3000
  healthcheck:
    interval: 3
    path: /health
    timeout: 3

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    VOUCH_LISTEN_ADDR: "0.0.0.0:3000"
    VOUCH_RP_ID: "dev.vouch.sh"
    VOUCH_RP_NAME: "Vouch Dev"
    VOUCH_BASE_URL: "https://dev.vouch.sh"
    VOUCH_DATABASE_URL: "sqlite:/data/vouch.db?mode=rwc"
    VOUCH_SSH_CA_KEY_PATH: "/data/ssh_ca_key"
    VOUCH_REQUIRE_ATTESTATION_CERT: "true"
    RUST_LOG: "info,vouch_server=debug"
    VOUCH_IDPS: "google"
    VOUCH_IDP_GOOGLE_TYPE: "oidc"
  secret:
    - VOUCH_JWT_SECRET
    - VOUCH_IDP_GOOGLE_ISSUER
    - VOUCH_IDP_GOOGLE_CLIENT_ID
    - VOUCH_IDP_GOOGLE_CLIENT_SECRET
    - VOUCH_OIDC_SIGNING_KEY
    - VOUCH_OIDC_RSA_SIGNING_KEY
    - VOUCH_GITHUB_APP_NAME
    - VOUCH_GITHUB_APP_ID
    - VOUCH_GITHUB_APP_KEY
    - VOUCH_GITHUB_WEBHOOK_SECRET
    - VOUCH_GITHUB_APP_CLIENT_ID
    - VOUCH_GITHUB_APP_CLIENT_SECRET

volumes:
  - "/opt/vouch/data:/data"

# SSH configuration
ssh:
  user: kamal

# Build configuration
builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max,image-manifest=true,oci-mediatypes=true
