# prek / pre-commit hook configuration — https://github.com/j178/prek
#   Install shims:  prek install          (installs pre-commit + pre-push shims)
#   Run everything: prek run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Skip generated + large binary-data files. Tailwind's output.css is generated by
# `make css-build`; the MaxMind GeoLite2 *.mmdb files are large binaries refreshed
# by scripts/update-geoip.sh (excluded from all formatting + the large-file check).
# Fonts/images are binary and auto-skipped by the hooks themselves.
#
# specs/ holds upstream specification text refreshed by scripts/refresh-specs.sh.
# The RFC and OpenID .txt files are byte-identical to their origins so a cached
# quote can be verified with sha256 — trailing-whitespace, end-of-file-fixer, and
# mixed-line-ending would auto-fix that fidelity away. Spec text also carries
# example PEM private-key blocks that trip detect-private-key.
exclude: |
  (?x)^(
    crates/vouch-server/static/css/output\.css|
    crates/vouch-server/data/.*\.mmdb|
    specs/.*
  )$

repos:
  # Generic file hygiene + private-key detection (external, SHA-pinned to match the
  # repo's GitHub Actions convention). Some hooks auto-fix files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        # Helm chart templates are Go templates, not valid YAML.
        exclude: ^charts/.*/templates/.*\.ya?ml$
      - id: check-toml
      - id: detect-private-key
        # Verified test vectors, PEM-header marker strings, and doc examples —
        # not real secrets (see first-run audit).
        exclude: |
          (?x)^(
            crates/vouch-httpsig/tests/rfc9421_vectors\.rs|
            crates/vouch-server/src/services/integrations/github/app\.rs|
            crates/vouch-server/src/infra/tls\.rs|
            crates/vouch-server/src/infra/s3_config\.rs|
            crates/vouch-server/src/crypto/keys\.rs|
            crates/vouch-server/src/crypto/pem\.rs
          )$
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local system hooks — call locally installed binaries; no third-party hook code.
  - repo: local
    hooks:
      # --- fast: every commit ---
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt (diff)
        entry: shfmt -i 2 -d
        language: system
        types: [shell]

      # Workflow lint + security. Only run when a workflow file is staged, so
      # pre-existing findings block a commit only when that workflow is edited.
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # --- slow: git push only ---
      - id: cargo-clippy
        name: cargo clippy --all-targets --all-features -D warnings
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: cargo test --all-features
        entry: cargo test --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
