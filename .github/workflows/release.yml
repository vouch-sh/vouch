name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  version:
    name: Compute Version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Build and attest run inside the reusable workflow so the Sigstore
  # certificate records reusable-build.yml as the signer identity (SLSA
  # Build Level 3). The permissions here are the ceiling for the called
  # workflow's jobs; each job inside declares its own subset.
  build:
    name: Build
    needs: [license-audit, version]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  linux-packages:
    name: Linux Packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cli_artifact: binaries-linux-amd64
            cli_target: x86_64-unknown-linux-musl
            server_artifact: binaries-linux-amd64-server
            server_target: x86_64-unknown-linux-musl
            nfpm_arch: amd64
          - arch: arm64
            cli_artifact: binaries-linux-arm64
            cli_target: aarch64-unknown-linux-musl
            server_artifact: binaries-linux-arm64-server
            server_target: aarch64-unknown-linux-musl
            nfpm_arch: arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.cli_artifact }}
          path: artifacts-cli

      - name: Download server artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.server_artifact }}
          path: artifacts-server

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLI_TARGET: ${{ matrix.cli_target }}
          SERVER_TARGET: ${{ matrix.server_target }}
        run: |
          mkdir -p artifacts
          # Extract CLI and agent from musl build
          cd artifacts-cli
          tar xzf "vouch-v${VERSION}-${CLI_TARGET}.tar.gz"
          cp "vouch-v${VERSION}-${CLI_TARGET}/vouch" ../artifacts/
          cp "vouch-v${VERSION}-${CLI_TARGET}/vouch-agent" ../artifacts/
          # Extract server from musl build
          cd ../artifacts-server
          tar xzf "vouch-server-v${VERSION}-${SERVER_TARGET}.tar.gz"
          cp "vouch-server-v${VERSION}-${SERVER_TARGET}/vouch-server" ../artifacts/

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Import GPG key for RPM signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the key ID for nfpm
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"
          # Export key to file for nfpm
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --export-secret-keys --armor "${GPG_KEY_ID}" > /tmp/gpg-key.asc
          echo "GPG_KEY_FILE=/tmp/gpg-key.asc" >> "$GITHUB_ENV"
          # Verify the key file was created
          echo "Key file size: $(wc -c < /tmp/gpg-key.asc) bytes"
          head -1 /tmp/gpg-key.asc

      - name: Build DEB package
        working-directory: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          nfpm package --config ../packaging/nfpm.yaml --packager deb

      - name: Build RPM package
        working-directory: artifacts
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FILE: ${{ env.GPG_KEY_FILE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          echo "Signing with key ID: ${GPG_KEY_ID}"
          echo "Key file exists: $(test -f "${GPG_KEY_FILE}" && echo yes || echo no)"
          nfpm package --config ../packaging/nfpm.yaml --packager rpm
          # Verify signature
          rpm -qpi vouch-*.rpm | grep -i signature || echo "WARNING: Package not signed!"

      - name: Build Server RPM package
        working-directory: artifacts
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FILE: ${{ env.GPG_KEY_FILE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          nfpm package --config ../packaging/nfpm-server.yaml --packager rpm
          # Verify signature
          rpm -qpi vouch-server-*.rpm | grep -i signature || echo "WARNING: Package not signed!"

      - name: Cleanup GPG key
        if: always()
        run: rm -f /tmp/gpg-key.asc

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.rpm
          if-no-files-found: error
          retention-days: 5

  verify-reproducibility:
    name: Verify Reproducible Build (Linux)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Rebuild binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: reproduce
        env:
          TARGET: x86_64-unknown-linux-musl
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - name: Download original artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux-amd64
          path: original

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract original binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd original
          tar xzf "vouch-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"

      - name: Create deterministic archive from rebuilt binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARGET="x86_64-unknown-linux-musl"
          STAGING="vouch-v${VERSION}-${TARGET}"

          mkdir -p "rebuild/${STAGING}"
          cp "target/${TARGET}/release/vouch" "rebuild/${STAGING}/"
          cp "target/${TARGET}/release/vouch-agent" "rebuild/${STAGING}/"

          cd rebuild
          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -czf "${STAGING}.tar.gz" "${STAGING}"
          sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Compare binaries and archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARGET="x86_64-unknown-linux-musl"
          ARCHIVE="vouch-v${VERSION}-${TARGET}.tar.gz"

          echo "=== Verifying against published SHA256 checksum ==="
          PUBLISHED_HASH=$(cat "original/${ARCHIVE}.sha256" | awk '{print $1}')
          REBUILD_ARCHIVE_HASH=$(cat "rebuild/${ARCHIVE}.sha256" | awk '{print $1}')

          echo "Published:       ${PUBLISHED_HASH}"
          echo "Rebuilt archive: ${REBUILD_ARCHIVE_HASH}"

          if [ "${PUBLISHED_HASH}" = "${REBUILD_ARCHIVE_HASH}" ]; then
            echo "::notice::Archive hash matches published SHA256SUMS - build is reproducible!"
            echo "ARCHIVE_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Archive hash does not match published SHA256SUMS"
            echo "ARCHIVE_MATCH=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=== Comparing individual binaries ==="

          echo ""
          echo "vouch CLI binary:"
          ORIGINAL_HASH=$(sha256sum "original/vouch-v${VERSION}-${TARGET}/vouch" | awk '{print $1}')
          REBUILD_HASH=$(sha256sum "target/${TARGET}/release/vouch" | awk '{print $1}')
          echo "  Original: ${ORIGINAL_HASH}"
          echo "  Rebuild:  ${REBUILD_HASH}"

          if [ "${ORIGINAL_HASH}" = "${REBUILD_HASH}" ]; then
            echo "::notice::vouch CLI binary hashes match!"
            echo "VOUCH_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::vouch CLI binary hashes do not match"
            echo "VOUCH_MATCH=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "vouch-agent binary:"
          ORIGINAL_AGENT_HASH=$(sha256sum "original/vouch-v${VERSION}-${TARGET}/vouch-agent" | awk '{print $1}')
          REBUILD_AGENT_HASH=$(sha256sum "target/${TARGET}/release/vouch-agent" | awk '{print $1}')
          echo "  Original: ${ORIGINAL_AGENT_HASH}"
          echo "  Rebuild:  ${REBUILD_AGENT_HASH}"

          if [ "${ORIGINAL_AGENT_HASH}" = "${REBUILD_AGENT_HASH}" ]; then
            echo "::notice::vouch-agent binary hashes match!"
            echo "AGENT_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::vouch-agent binary hashes do not match"
            echo "AGENT_MATCH=false" >> "$GITHUB_ENV"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VOUCH_MATCH: ${{ env.VOUCH_MATCH }}
          AGENT_MATCH: ${{ env.AGENT_MATCH }}
        run: |
          TARGET="x86_64-unknown-linux-musl"
          PUBLISHED_HASH=$(awk '{print $1}' "original/vouch-v${VERSION}-${TARGET}.tar.gz.sha256")
          REBUILD_HASH=$(awk '{print $1}' "rebuild/vouch-v${VERSION}-${TARGET}.tar.gz.sha256")

          {
            echo "## Reproducibility Verification"
            echo ""
            echo "Rebuilt Linux x86_64 binaries from the same commit and compared hashes."
            echo ""
            echo "### Archive Verification"
            echo ""
            echo "| Artifact | Published Hash | Rebuilt Hash | Status |"
            echo "|----------|----------------|--------------|--------|"

            if [ "${PUBLISHED_HASH}" = "${REBUILD_HASH}" ]; then
              echo "| \`vouch-v${VERSION}-${TARGET}.tar.gz\` | \`${PUBLISHED_HASH:0:16}...\` | \`${REBUILD_HASH:0:16}...\` | ✅ Match |"
            else
              echo "| \`vouch-v${VERSION}-${TARGET}.tar.gz\` | \`${PUBLISHED_HASH:0:16}...\` | \`${REBUILD_HASH:0:16}...\` | ⚠️ Differs |"
            fi

            echo ""
            echo "### Binary Verification"
            echo ""
            echo "| Binary | Status |"
            echo "|--------|--------|"

            if [ "${VOUCH_MATCH}" = "true" ]; then
              echo "| vouch | ✅ Reproducible |"
            else
              echo "| vouch | ⚠️ Differs |"
            fi

            if [ "${AGENT_MATCH}" = "true" ]; then
              echo "| vouch-agent | ✅ Reproducible |"
            else
              echo "| vouch-agent | ⚠️ Differs |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: Trigger Conformance Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Trigger conformance tests
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          gh api repos/vouch-sh/conformance/dispatches \
            -f event_type=release \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[image]=${IMAGE}"

  release-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [build, linux-packages]
    permissions:
      contents: write

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Download Helm chart artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart
          path: artifacts

      - name: Generate consolidated SHA256SUMS
        run: |
          cd artifacts
          sha256sum -- *.tar.gz *.zip *.deb *.rpm 2>/dev/null > SHA256SUMS.txt || true

      - name: Upload release artifacts
        # Pinned action handles draft creation and multi-glob asset upload;
        # kept intentionally over a hand-rolled gh release script step.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.tgz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*cdx.json
            artifacts/SHA256SUMS.txt

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release-artifacts
    permissions:
      contents: write

    steps:
      - name: Publish release (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release edit "${REF_TAG}" \
            --repo "${REPOSITORY}" \
            --draft=false

  winget:
    name: Publish to winget
    runs-on: ubuntu-latest
    needs: publish-release
    # Don't fail the Release workflow if winget submission fails — downstream
    # workflows (e.g. Build AMI) are gated on Release succeeding and have no
    # dependency on winget output.
    continue-on-error: true
    permissions:
      contents: read
    env:
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d

    steps:
      - name: Install komac
        run: |
          ARCHIVE="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "${ARCHIVE}" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${ARCHIVE}"
          echo "${KOMAC_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}"
          sudo install -m 0755 komac /usr/local/bin/komac
          komac --version

      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          URLS=$(gh api "repos/${REPOSITORY}/releases/tags/${TAG}" \
            --jq '[.assets[] | select(.name | test("\\.zip$")) | .browser_download_url] | join(" ")')
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "urls=${URLS}" >> "$GITHUB_OUTPUT"

      - name: Sync winget-pkgs fork
        env:
          KOMAC_FORK_OWNER: vouch-bot
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: komac sync-fork

      - name: Generate winget manifests
        env:
          KOMAC_FORK_OWNER: vouch-bot
          KOMAC_CREATED_WITH: vouch-release-workflow
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          URLS: ${{ steps.release.outputs.urls }}
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # shellcheck disable=SC2086 # URLS is a space-separated list of args
          komac update SmokeTurner.Vouch \
            --version "${VERSION}" \
            --release-notes-url "${RELEASE_NOTES_URL}" \
            --output ./winget-manifests \
            --dry-run \
            --urls ${URLS}

      - name: Strip ReleaseNotes from locale manifest
        # komac auto-fetches the GitHub release body to populate ReleaseNotes.
        # The fetch is unreliable (silently empty under API propagation lag)
        # and the field is not required by winget — once present in any
        # version it becomes sticky for all future versions. Keep manifests
        # ReleaseNotesUrl-only to avoid that ratchet.
        # komac --output writes to the nested winget-pkgs layout
        # (./winget-manifests/manifests/s/SmokeTurner/Vouch/<version>/),
        # so recurse via find.
        run: |
          find ./winget-manifests -name '*.locale.*.yaml' -print0 \
            | xargs -0 -r yq -i 'del(.ReleaseNotes)'

      - name: Normalize manifest line endings to CRLF
        # Workaround for komac v2.16.0 bug: --release-notes-url value is
        # written with LF instead of CRLF, which fails winget-pkgs validation.
        # Slurp each file (-0) so we can normalize any line ending (CRLF, CR,
        # or LF) and append a trailing CRLF if missing — the prior yq step
        # can drop the trailing newline, which line-mode perl wouldn't add back.
        run: |
          # shellcheck disable=SC2016  # $1 is a Perl backreference, not a shell variable
          find ./winget-manifests -name '*.yaml' -print0 \
            | xargs -0 perl -i -0pe 's/\r\n|\r|\n/\r\n/g; s/([^\n])\z/$1\r\n/'
          if grep -RPlz '(?<!\r)\n' ./winget-manifests; then
            echo "::error::manifests contain bare LF line endings"
            exit 1
          fi

      - name: Submit winget update
        env:
          KOMAC_FORK_OWNER: vouch-bot
          KOMAC_CREATED_WITH: vouch-release-workflow
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: komac submit ./winget-manifests --yes

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "${TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "SHA256SUMS.txt"

      - name: Extract macOS ARM64 SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA=$(grep "vouch-v${VERSION}-aarch64-apple-darwin.tar.gz" SHA256SUMS.txt | awk '{print $1}')
          echo "macos_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] — credentials required for git push
          repository: vouch-sh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_ARM64_SHA: ${{ steps.sha.outputs.macos_arm64 }}
        run: |
          cat > homebrew-tap/Formula/vouch.rb << FORMULA
          class Vouch < Formula
            desc "Hardware-backed identity for developers"
            homepage "https://github.com/vouch-sh/vouch"
            version "${VERSION}"
            license "Apache-2.0 OR MIT"

            on_macos do
              on_arm do
                url "https://github.com/vouch-sh/vouch/releases/download/v${VERSION}/vouch-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              end
            end

            def install
              bin.install "vouch"
              bin.install "vouch-agent"
              generate_completions_from_executable(bin/"vouch", "completions")
            end

            service do
              run [opt_bin/"vouch-agent", "--foreground"]
              keep_alive true
              log_path var/"log/vouch-agent.log"
              error_log_path var/"log/vouch-agent.log"
            end

            def caveats
              <<~EOS
                To restart the vouch-agent service after upgrading:
                  brew services restart vouch
              EOS
            end

            test do
              assert_match "vouch", shell_output("#{bin}/vouch --version")
            end
          end
          FORMULA

      - name: Commit and push formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vouch.rb
          git commit -m "vouch ${VERSION}"
          git push

  publish-packages:
    name: Publish Package Repositories
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download .deb and .rpm from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "${TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "*.deb" \
            --pattern "*.rpm" \
            --dir packages

      - name: Checkout packages repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] — credentials required for git push
          repository: vouch-sh/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: packages-repo

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c

      - name: Update APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd packages-repo

          # Copy .deb files to pool
          cp ../packages/*.deb apt/pool/main/

          # Generate Packages indices for each architecture
          cd apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "${arch}" pool/main > "dists/stable/main/binary-${arch}/Packages"
            gzip -9c "dists/stable/main/binary-${arch}/Packages" > "dists/stable/main/binary-${arch}/Packages.gz"
          done

          # Generate Release file
          cd dists/stable
          apt-ftparchive release -c ../../../apt-ftparchive.conf . > Release

          # Sign Release file
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o Release.gpg Release

      - name: Update RPM repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd packages-repo

          # Copy .rpm files to architecture directories
          for rpm in ../packages/*.rpm; do
            arch=$(rpm -qp --queryformat '%{ARCH}' "${rpm}" 2>/dev/null || echo "")
            case "${arch}" in
              x86_64)  cp "${rpm}" rpm/x86_64/ ;;
              aarch64) cp "${rpm}" rpm/aarch64/ ;;
            esac
          done

          # Generate RPM metadata and sign
          for arch in x86_64 aarch64; do
            createrepo_c --update "rpm/${arch}/"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "rpm/${arch}/repodata/repomd.xml.asc" "rpm/${arch}/repodata/repomd.xml"
          done

      - name: Commit and push
        working-directory: packages-repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "vouch ${VERSION}"
          git push

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [build, publish-release, homebrew, publish-packages]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        # Pinned action handles GitHub auto-generated release notes plus the
        # custom body; kept intentionally over a hand-rolled gh release step.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            ### Homebrew (macOS)

            ```bash
            brew install vouch-sh/tap/vouch
            ```

            To start the agent automatically:

            ```bash
            brew services start vouch
            ```

            ### winget (Windows)

            ```pwsh
            winget install SmokeTurner.Vouch
            ```

            ### APT Repository (Debian/Ubuntu)

            ```bash
            curl -fsSL https://packages.vouch.sh/gpg/vouch.asc \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/vouch-archive-keyring.gpg > /dev/null

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/vouch-archive-keyring.gpg] https://packages.vouch.sh/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vouch.list > /dev/null

            sudo apt-get update && sudo apt-get install -y vouch
            ```

            ### YUM/DNF Repository (Fedora/RHEL)

            ```bash
            sudo tee /etc/yum.repos.d/vouch.repo << 'EOF'
            [vouch]
            name=Vouch
            baseurl=https://packages.vouch.sh/rpm/$basearch/
            gpgcheck=1
            gpgkey=https://packages.vouch.sh/gpg/vouch.asc
            enabled=1
            EOF

            sudo dnf install -y vouch
            ```

            ### DEB Package (Debian/Ubuntu)

            ```bash
            # amd64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch_${{ steps.version.outputs.version }}_amd64.deb"
            sudo dpkg -i vouch_${{ steps.version.outputs.version }}_amd64.deb

            # arm64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch_${{ steps.version.outputs.version }}_arm64.deb"
            sudo dpkg -i vouch_${{ steps.version.outputs.version }}_arm64.deb
            ```

            ### RPM Package (Fedora/RHEL)

            ```bash
            # x86_64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch-${{ steps.version.outputs.version }}-1.x86_64.rpm"
            sudo rpm -i vouch-${{ steps.version.outputs.version }}-1.x86_64.rpm

            # aarch64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch-${{ steps.version.outputs.version }}-1.aarch64.rpm"
            sudo rpm -i vouch-${{ steps.version.outputs.version }}-1.aarch64.rpm
            ```

            ### Binary Downloads

            Download the appropriate binary for your platform from the release assets below.

            | Platform | Architecture | Archive |
            |----------|-------------|---------|
            | Linux | x86_64 | `vouch-${{ steps.version.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz` |
            | Linux | aarch64 | `vouch-${{ steps.version.outputs.tag }}-aarch64-unknown-linux-musl.tar.gz` |
            | macOS | Apple Silicon | `vouch-${{ steps.version.outputs.tag }}-aarch64-apple-darwin.tar.gz` |
            | Windows | x86_64 | `vouch-${{ steps.version.outputs.tag }}-x86_64-pc-windows-msvc.zip` |
            | Windows | ARM64 | `vouch-${{ steps.version.outputs.tag }}-aarch64-pc-windows-msvc.zip` |

            #### Verify integrity

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            #### Verify provenance

            ```bash
            gh attestation verify vouch-${{ steps.version.outputs.tag }}-aarch64-apple-darwin.tar.gz \
              --owner vouch-sh \
              --signer-workflow vouch-sh/vouch/.github/workflows/reusable-build.yml
            ```

            ### Using Helm (OCI)

            ```bash
            helm install vouch-server oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/vouch-server \
              --version ${{ steps.version.outputs.version }} \
              --namespace vouch-server \
              --create-namespace
            ```

            ### Using Helm (from release assets)

            ```bash
            helm install vouch-server \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/vouch-server-${{ steps.version.outputs.version }}.tgz \
              --namespace vouch-server \
              --create-namespace
            ```

            ### Container Image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ```

            ### Verify Attestations

            ```bash
            # Container image
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
              --owner ${{ github.repository_owner }} \
              --signer-workflow vouch-sh/vouch/.github/workflows/reusable-build.yml

            # Binary archives
            gh attestation verify vouch-${{ steps.version.outputs.tag }}-aarch64-apple-darwin.tar.gz \
              --owner vouch-sh \
              --signer-workflow vouch-sh/vouch/.github/workflows/reusable-build.yml

            # Helm chart
            gh attestation verify vouch-server-${{ steps.version.outputs.version }}.tgz \
              --owner vouch-sh \
              --signer-workflow vouch-sh/vouch/.github/workflows/reusable-build.yml
            ```
