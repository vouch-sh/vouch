name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check licenses advisories sources

  build:
    name: Build and Push (${{ matrix.platform }})
    needs: license-audit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: digests-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: digests-arm64
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=gha,scope=ci-scan
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.event.inputs.tag || github.ref_name) }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        id: inspect
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${META_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  build-cli:
    name: Build CLI (${{ matrix.name }})
    needs: license-audit
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bins: "vouch vouch-agent"
            archive-ext: tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bins: "vouch vouch-agent"
            archive-ext: tar.gz
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bins: "vouch vouch-agent"
            archive-ext: tar.gz
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bins: "vouch"
            archive-ext: zip
            rustflags: "-C target-feature=+crt-static"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bins: "vouch"
            archive-ext: zip
            rustflags: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Install GNU tar (macOS)
        if: runner.os == 'macOS'
        run: brew list gnu-tar &>/dev/null || brew install gnu-tar

      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "${TARGET}"

      - name: Setup Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "release-${{ matrix.target }}"
          save-if: "false"

      - name: Set RUSTFLAGS
        if: matrix.rustflags
        shell: bash
        env:
          RUSTFLAGS_VALUE: ${{ matrix.rustflags }}
        run: echo "RUSTFLAGS=${RUSTFLAGS_VALUE}" >> "$GITHUB_ENV"

      - name: Cache cargo binaries
        if: runner.os != 'Linux'
        id: cache-cargo-bin
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/bin/cargo-cyclonedx.exe
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-bin-cyclonedx-v0.5.6

      - name: Install cargo-cyclonedx
        if: runner.os != 'Linux' && steps.cache-cargo-bin.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install cargo-cyclonedx --version 0.5.6

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build CLI and Agent (Linux)
        if: runner.os == 'Linux'
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          targets: cli
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          GENERATE_SBOM: "true"

      - name: Build CLI and Agent
        if: runner.os != 'Linux' && matrix.bins == 'vouch vouch-agent'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "${TARGET}" -p vouch-cli -p vouch-agent

      - name: Build CLI only
        if: matrix.bins == 'vouch'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "${TARGET}" -p vouch-cli

      - name: Generate SBOM
        if: runner.os != 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo cyclonedx --target "${TARGET}" --format json

      - name: Get version
        id: version
        shell: bash
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Code sign macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
          TARGET: ${{ matrix.target }}
          BINS: ${{ matrix.bins }}
        run: |
          for bin in ${BINS}; do
            echo "Signing ${bin}..."
            /usr/bin/codesign --force \
              --sign "$APPLE_CERTIFICATE_NAME" \
              --options runtime \
              --timestamp \
              "target/${TARGET}/release/${bin}"
            /usr/bin/codesign --verify "target/${TARGET}/release/${bin}"
          done

      - name: Notarize macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          BINS: ${{ matrix.bins }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD"

          NOTARIZE_ZIP="vouch-notarize-${VERSION}.zip"
          mkdir -p notarize-staging
          for bin in ${BINS}; do
            cp "target/${TARGET}/release/${bin}" notarize-staging/
          done
          ditto -c -k --keepParent notarize-staging "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --keychain-profile "notarytool-profile" \
            --wait

          rm -rf notarize-staging "$NOTARIZE_ZIP"

      - name: Create archive (tar.gz)
        if: matrix.archive-ext == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINS: ${{ matrix.bins }}
        run: |
          STAGING="vouch-v${VERSION}-${TARGET}"

          # Use GNU tar (gtar on macOS, tar on Linux)
          if command -v gtar &> /dev/null; then
            TAR_CMD="gtar"
          else
            TAR_CMD="tar"
          fi

          mkdir -p "${STAGING}"
          for bin in ${BINS}; do
            cp "target/${TARGET}/release/${bin}" "${STAGING}/"
          done

          # Create deterministic archive for reproducible builds
          $TAR_CMD --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -czf "${STAGING}.tar.gz" "${STAGING}"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Create archive (zip)
        if: matrix.archive-ext == 'zip'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINS: ${{ matrix.bins }}
        run: |
          STAGING="vouch-v${VERSION}-${TARGET}"

          mkdir -p "${STAGING}"
          for bin in ${BINS}; do
            cp "target/${TARGET}/release/${bin}.exe" "${STAGING}/"
          done

          7z a "${STAGING}.zip" "${STAGING}"
          sha256sum "${STAGING}.zip" > "${STAGING}.zip.sha256"

      - name: Collect SBOM artifacts
        id: sbom
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          MAIN_SBOM=""
          # Find and copy CycloneDX SBOMs with target-specific names
          for sbom in $(find . -maxdepth 3 -name "*_cdx.json" -o -name "*.cdx.json" 2>/dev/null | grep -v "^./target/"); do
            base=$(basename "${sbom}")
            dest="vouch-v${VERSION}-${TARGET}-${base}"
            cp "${sbom}" "${dest}"
            # Use vouch-cli SBOM as the main one for attestation (always present)
            if [[ "${base}" == *"vouch-cli"* ]] || [[ "${base}" == *"vouch_cli"* ]]; then
              MAIN_SBOM="${dest}"
            fi
          done
          # Fallback to first SBOM found if no vouch-cli specific one
          if [[ -z "${MAIN_SBOM}" ]]; then
            MAIN_SBOM=$(ls vouch-v${VERSION}-${TARGET}-*cdx.json 2>/dev/null | head -1)
          fi
          echo "main_sbom=${MAIN_SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binaries-${{ matrix.name }}
          path: |
            vouch-v*.tar.gz
            vouch-v*.zip
            vouch-v*.sha256
            vouch-v*cdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Attest build provenance (CLI archive)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: vouch-v${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-ext }}

      - name: Attest SBOM (CLI archive)
        if: steps.sbom.outputs.main_sbom != ''
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: vouch-v${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-ext }}
          sbom-path: ${{ steps.sbom.outputs.main_sbom }}

      - name: Cleanup macOS keychain
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true

  build-server:
    name: Build Server (${{ matrix.name }})
    needs: license-audit
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-server
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64-server
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CSS
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)
              BINARY="tailwindcss-linux-x64"
              CHECKSUM="8f84ce810bdff225e599781d1e2daa82b4282229021c867a71b419f59f9aa836"
              ;;
            aarch64)
              BINARY="tailwindcss-linux-arm64"
              CHECKSUM="28a77d1e59b0e45b41683c1e3947621fdfe73f6895b05db7c34f63f3f4898e8d"
              ;;
          esac
          curl -sLO "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.8/${BINARY}"
          echo "${CHECKSUM}  ${BINARY}" | sha256sum -c -
          chmod +x "${BINARY}"
          cd crates/vouch-server && "../../${BINARY}" -i styles/input.css -o static/css/output.css --minify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build server and generate SBOM (musl)
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          targets: server
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          GENERATE_SBOM: "true"

      - name: Create server archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          SERVER_STAGING="vouch-server-v${VERSION}-${TARGET}"

          mkdir -p "${SERVER_STAGING}"
          cp "target/${TARGET}/release/vouch-server" "${SERVER_STAGING}/"

          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -czf "${SERVER_STAGING}.tar.gz" "${SERVER_STAGING}"
          shasum -a 256 "${SERVER_STAGING}.tar.gz" > "${SERVER_STAGING}.tar.gz.sha256"

      - name: Collect SBOM artifacts
        id: sbom
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          MAIN_SBOM=""
          for sbom in $(find . -maxdepth 3 -name "*_cdx.json" -o -name "*.cdx.json" 2>/dev/null | grep -v "^./target/"); do
            base=$(basename "${sbom}")
            dest="vouch-v${VERSION}-${TARGET}-${base}"
            cp "${sbom}" "${dest}"
            if [[ "${base}" == *"vouch-server"* ]] || [[ "${base}" == *"vouch_server"* ]]; then
              MAIN_SBOM="${dest}"
            fi
          done
          if [[ -z "${MAIN_SBOM}" ]]; then
            MAIN_SBOM=$(ls vouch-v${VERSION}-${TARGET}-*cdx.json 2>/dev/null | head -1)
          fi
          echo "main_sbom=${MAIN_SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binaries-${{ matrix.name }}
          path: |
            vouch-server-v*.tar.gz
            vouch-server-v*.sha256
            vouch-v*cdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Attest build provenance (server archive)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: vouch-server-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz

      - name: Attest SBOM (server archive)
        if: steps.sbom.outputs.main_sbom != ''
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: vouch-server-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          sbom-path: ${{ steps.sbom.outputs.main_sbom }}

  linux-packages:
    name: Linux Packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [build-cli, build-server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cli_artifact: binaries-linux-amd64
            cli_target: x86_64-unknown-linux-musl
            server_artifact: binaries-linux-amd64-server
            server_target: x86_64-unknown-linux-musl
            nfpm_arch: amd64
          - arch: arm64
            cli_artifact: binaries-linux-arm64
            cli_target: aarch64-unknown-linux-musl
            server_artifact: binaries-linux-arm64-server
            server_target: aarch64-unknown-linux-musl
            nfpm_arch: arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.cli_artifact }}
          path: artifacts-cli

      - name: Download server artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.server_artifact }}
          path: artifacts-server

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLI_TARGET: ${{ matrix.cli_target }}
          SERVER_TARGET: ${{ matrix.server_target }}
        run: |
          mkdir -p artifacts
          # Extract CLI and agent from musl build
          cd artifacts-cli
          tar xzf "vouch-v${VERSION}-${CLI_TARGET}.tar.gz"
          cp "vouch-v${VERSION}-${CLI_TARGET}/vouch" ../artifacts/
          cp "vouch-v${VERSION}-${CLI_TARGET}/vouch-agent" ../artifacts/
          # Extract server from musl build
          cd ../artifacts-server
          tar xzf "vouch-server-v${VERSION}-${SERVER_TARGET}.tar.gz"
          cp "vouch-server-v${VERSION}-${SERVER_TARGET}/vouch-server" ../artifacts/

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Import GPG key for RPM signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the key ID for nfpm
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"
          # Export key to file for nfpm
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --export-secret-keys --armor "${GPG_KEY_ID}" > /tmp/gpg-key.asc
          echo "GPG_KEY_FILE=/tmp/gpg-key.asc" >> "$GITHUB_ENV"
          # Verify the key file was created
          echo "Key file size: $(wc -c < /tmp/gpg-key.asc) bytes"
          head -1 /tmp/gpg-key.asc

      - name: Build DEB package
        working-directory: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          nfpm package --config ../packaging/nfpm.yaml --packager deb

      - name: Build RPM package
        working-directory: artifacts
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FILE: ${{ env.GPG_KEY_FILE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          echo "Signing with key ID: ${GPG_KEY_ID}"
          echo "Key file exists: $(test -f ${GPG_KEY_FILE} && echo yes || echo no)"
          nfpm package --config ../packaging/nfpm.yaml --packager rpm
          # Verify signature
          rpm -qpi vouch-*.rpm | grep -i signature || echo "WARNING: Package not signed!"

      - name: Build Server RPM package
        working-directory: artifacts
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FILE: ${{ env.GPG_KEY_FILE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          nfpm package --config ../packaging/nfpm-server.yaml --packager rpm
          # Verify signature
          rpm -qpi vouch-server-*.rpm | grep -i signature || echo "WARNING: Package not signed!"

      - name: Cleanup GPG key
        if: always()
        run: rm -f /tmp/gpg-key.asc

      - name: Upload package artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: packages-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.rpm
          if-no-files-found: error
          retention-days: 5

  verify-reproducibility:
    name: Verify Reproducible Build (Linux)
    runs-on: ubuntu-latest
    needs: build-cli
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Rebuild binaries
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          targets: reproduce
        env:
          TARGET: x86_64-unknown-linux-musl
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - name: Download original artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux-amd64
          path: original

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract original binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd original
          tar xzf "vouch-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"

      - name: Create deterministic archive from rebuilt binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARGET="x86_64-unknown-linux-musl"
          STAGING="vouch-v${VERSION}-${TARGET}"

          mkdir -p "rebuild/${STAGING}"
          cp "target/${TARGET}/release/vouch" "rebuild/${STAGING}/"
          cp "target/${TARGET}/release/vouch-agent" "rebuild/${STAGING}/"

          cd rebuild
          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -czf "${STAGING}.tar.gz" "${STAGING}"
          sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Compare binaries and archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARGET="x86_64-unknown-linux-musl"
          ARCHIVE="vouch-v${VERSION}-${TARGET}.tar.gz"

          echo "=== Verifying against published SHA256 checksum ==="
          PUBLISHED_HASH=$(cat "original/${ARCHIVE}.sha256" | awk '{print $1}')
          REBUILD_ARCHIVE_HASH=$(cat "rebuild/${ARCHIVE}.sha256" | awk '{print $1}')

          echo "Published:       ${PUBLISHED_HASH}"
          echo "Rebuilt archive: ${REBUILD_ARCHIVE_HASH}"

          if [ "${PUBLISHED_HASH}" = "${REBUILD_ARCHIVE_HASH}" ]; then
            echo "::notice::Archive hash matches published SHA256SUMS - build is reproducible!"
            echo "ARCHIVE_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Archive hash does not match published SHA256SUMS"
            echo "ARCHIVE_MATCH=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=== Comparing individual binaries ==="

          echo ""
          echo "vouch CLI binary:"
          ORIGINAL_HASH=$(sha256sum "original/vouch-v${VERSION}-${TARGET}/vouch" | awk '{print $1}')
          REBUILD_HASH=$(sha256sum "target/${TARGET}/release/vouch" | awk '{print $1}')
          echo "  Original: ${ORIGINAL_HASH}"
          echo "  Rebuild:  ${REBUILD_HASH}"

          if [ "${ORIGINAL_HASH}" = "${REBUILD_HASH}" ]; then
            echo "::notice::vouch CLI binary hashes match!"
            echo "VOUCH_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::vouch CLI binary hashes do not match"
            echo "VOUCH_MATCH=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "vouch-agent binary:"
          ORIGINAL_AGENT_HASH=$(sha256sum "original/vouch-v${VERSION}-${TARGET}/vouch-agent" | awk '{print $1}')
          REBUILD_AGENT_HASH=$(sha256sum "target/${TARGET}/release/vouch-agent" | awk '{print $1}')
          echo "  Original: ${ORIGINAL_AGENT_HASH}"
          echo "  Rebuild:  ${REBUILD_AGENT_HASH}"

          if [ "${ORIGINAL_AGENT_HASH}" = "${REBUILD_AGENT_HASH}" ]; then
            echo "::notice::vouch-agent binary hashes match!"
            echo "AGENT_MATCH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::vouch-agent binary hashes do not match"
            echo "AGENT_MATCH=false" >> "$GITHUB_ENV"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VOUCH_MATCH: ${{ env.VOUCH_MATCH }}
          AGENT_MATCH: ${{ env.AGENT_MATCH }}
        run: |
          TARGET="x86_64-unknown-linux-musl"

          echo "## Reproducibility Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rebuilt Linux x86_64 binaries from the same commit and compared hashes." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Archive Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Published Hash | Rebuilt Hash | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------------|--------------|--------|" >> $GITHUB_STEP_SUMMARY

          PUBLISHED_HASH=$(cat "original/vouch-v${VERSION}-${TARGET}.tar.gz.sha256" | awk '{print $1}')
          REBUILD_HASH=$(cat "rebuild/vouch-v${VERSION}-${TARGET}.tar.gz.sha256" | awk '{print $1}')
          if [ "${PUBLISHED_HASH}" = "${REBUILD_HASH}" ]; then
            echo "| \`vouch-v${VERSION}-${TARGET}.tar.gz\` | \`${PUBLISHED_HASH:0:16}...\` | \`${REBUILD_HASH:0:16}...\` | ✅ Match |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`vouch-v${VERSION}-${TARGET}.tar.gz\` | \`${PUBLISHED_HASH:0:16}...\` | \`${REBUILD_HASH:0:16}...\` | ⚠️ Differs |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Binary Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${VOUCH_MATCH}" = "true" ]; then
            echo "| vouch | ✅ Reproducible |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| vouch | ⚠️ Differs |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${AGENT_MATCH}" = "true" ]; then
            echo "| vouch-agent | ✅ Reproducible |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| vouch-agent | ⚠️ Differs |" >> $GITHUB_STEP_SUMMARY
          fi

  helm:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Log in to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/vouch-server/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/vouch-server/Chart.yaml

      - name: Update image repository in values.yaml
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          sed -i "s|repository:.*|repository: ${REGISTRY_IMAGE}|" charts/vouch-server/values.yaml

      - name: Package Helm chart
        run: |
          helm package charts/vouch-server --destination .helm-packages

      - name: Generate Helm chart attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: .helm-packages/*.tgz

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: helm-chart
          path: .helm-packages/*.tgz
          if-no-files-found: error
          retention-days: 5
          include-hidden-files: true

      - name: Push Helm chart to OCI registry
        env:
          OCI_REGISTRY: oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        run: |
          helm push .helm-packages/*.tgz "${OCI_REGISTRY}"

  release-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-cli, build-server, linux-packages, merge, helm]
    permissions:
      contents: write

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Download Helm chart artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart
          path: artifacts

      - name: Generate consolidated SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.deb *.rpm 2>/dev/null > SHA256SUMS.txt || true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.tgz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*cdx.json
            artifacts/SHA256SUMS.txt

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release-artifacts
    permissions:
      contents: write

    steps:
      - name: Publish release (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release edit "${REF_TAG}" \
            --repo "${REPOSITORY}" \
            --draft=false

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "${TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "SHA256SUMS.txt"

      - name: Extract macOS ARM64 SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA=$(grep "vouch-v${VERSION}-aarch64-apple-darwin.tar.gz" SHA256SUMS.txt | awk '{print $1}')
          echo "macos_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: # zizmor: ignore[artipacked] — credentials required for git push
          repository: vouch-sh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_ARM64_SHA: ${{ steps.sha.outputs.macos_arm64 }}
        run: |
          cat > homebrew-tap/Formula/vouch.rb << FORMULA
          class Vouch < Formula
            desc "Hardware-backed identity for developers"
            homepage "https://github.com/vouch-sh/vouch"
            version "${VERSION}"
            license "Apache-2.0 OR MIT"

            on_macos do
              on_arm do
                url "https://github.com/vouch-sh/vouch/releases/download/v${VERSION}/vouch-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              end
            end

            def install
              bin.install "vouch"
              bin.install "vouch-agent"
              generate_completions_from_executable(bin/"vouch", "completions")
            end

            service do
              run [opt_bin/"vouch-agent", "--foreground"]
              keep_alive true
              log_path var/"log/vouch-agent.log"
              error_log_path var/"log/vouch-agent.log"
            end

            def caveats
              <<~EOS
                To restart the vouch-agent service after upgrading:
                  brew services restart vouch
              EOS
            end

            test do
              assert_match "vouch", shell_output("#{bin}/vouch --version")
            end
          end
          FORMULA

      - name: Commit and push formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vouch.rb
          git commit -m "vouch ${VERSION}"
          git push

  publish-packages:
    name: Publish Package Repositories
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download .deb and .rpm from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "${TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "*.deb" \
            --pattern "*.rpm" \
            --dir packages

      - name: Checkout packages repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: # zizmor: ignore[artipacked] — credentials required for git push
          repository: vouch-sh/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: packages-repo

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c

      - name: Update APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd packages-repo

          # Copy .deb files to pool
          cp ../packages/*.deb apt/pool/main/

          # Generate Packages indices for each architecture
          cd apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "${arch}" pool/main > "dists/stable/main/binary-${arch}/Packages"
            gzip -9c "dists/stable/main/binary-${arch}/Packages" > "dists/stable/main/binary-${arch}/Packages.gz"
          done

          # Generate Release file
          cd dists/stable
          apt-ftparchive release -c ../../../apt-ftparchive.conf . > Release

          # Sign Release file
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o Release.gpg Release

      - name: Update RPM repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd packages-repo

          # Copy .rpm files to architecture directories
          for rpm in ../packages/*.rpm; do
            arch=$(rpm -qp --queryformat '%{ARCH}' "${rpm}" 2>/dev/null || echo "")
            case "${arch}" in
              x86_64)  cp "${rpm}" rpm/x86_64/ ;;
              aarch64) cp "${rpm}" rpm/aarch64/ ;;
            esac
          done

          # Generate RPM metadata and sign
          for arch in x86_64 aarch64; do
            createrepo_c --update "rpm/${arch}/"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "rpm/${arch}/repodata/repomd.xml.asc" "rpm/${arch}/repodata/repomd.xml"
          done

      - name: Commit and push
        working-directory: packages-repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "vouch ${VERSION}"
          git push

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [merge, helm, publish-release, homebrew, publish-packages]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        env:
          REF_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REF_TAG#v}"
          echo "tag=${REF_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            ### Homebrew (macOS)

            ```bash
            brew install vouch-sh/tap/vouch
            ```

            To start the agent automatically:

            ```bash
            brew services start vouch
            ```

            ### APT Repository (Debian/Ubuntu)

            ```bash
            curl -fsSL https://packages.vouch.sh/gpg/vouch.asc \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/vouch-archive-keyring.gpg > /dev/null

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/vouch-archive-keyring.gpg] https://packages.vouch.sh/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vouch.list > /dev/null

            sudo apt-get update && sudo apt-get install -y vouch
            ```

            ### YUM/DNF Repository (Fedora/RHEL)

            ```bash
            sudo tee /etc/yum.repos.d/vouch.repo << 'EOF'
            [vouch]
            name=Vouch
            baseurl=https://packages.vouch.sh/rpm/$basearch/
            gpgcheck=1
            gpgkey=https://packages.vouch.sh/gpg/vouch.asc
            enabled=1
            EOF

            sudo dnf install -y vouch
            ```

            ### DEB Package (Debian/Ubuntu)

            ```bash
            # amd64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch_${{ steps.version.outputs.version }}_amd64.deb"
            sudo dpkg -i vouch_${{ steps.version.outputs.version }}_amd64.deb

            # arm64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch_${{ steps.version.outputs.version }}_arm64.deb"
            sudo dpkg -i vouch_${{ steps.version.outputs.version }}_arm64.deb
            ```

            ### RPM Package (Fedora/RHEL)

            ```bash
            # x86_64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch-${{ steps.version.outputs.version }}-1.x86_64.rpm"
            sudo rpm -i vouch-${{ steps.version.outputs.version }}-1.x86_64.rpm

            # aarch64
            gh release download ${{ steps.version.outputs.tag }} --repo ${{ github.repository }} --pattern "vouch-${{ steps.version.outputs.version }}-1.aarch64.rpm"
            sudo rpm -i vouch-${{ steps.version.outputs.version }}-1.aarch64.rpm
            ```

