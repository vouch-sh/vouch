name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Deny rustc warnings on plain `cargo build`/`cargo test` (new in cargo 1.97)
  # without invalidating the build cache, unlike RUSTFLAGS="-D warnings".
  CARGO_BUILD_WARNINGS: deny

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "fmt"
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_LC_FIPS_SYS_CC: clang
      AWS_LC_FIPS_SYS_CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "clippy-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
            cargo-args: ""
            fips-cc: clang
            fips-cxx: clang++
          - name: macos
            runner: macos-latest
            install-deps: brew install go
            cargo-args: ""
          - name: windows
            runner: windows-latest
            install-deps: ""
            cargo-args: "--workspace --exclude vouch-server --exclude vouch-agent --exclude vouch-tests"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "debug-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Set FIPS compiler # zizmor: ignore[template-injection] — static matrix values
        if: matrix.fips-cc
        run: |
          echo "AWS_LC_FIPS_SYS_CC=${{ matrix.fips-cc }}" >> "$GITHUB_ENV"
          echo "AWS_LC_FIPS_SYS_CXX=${{ matrix.fips-cxx }}" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked --all-features ${{ matrix.cargo-args }} # zizmor: ignore[template-injection] — static matrix value

  build:
    name: Build (${{ matrix.name }})
    # Skipped in merge groups: the queue gates on the fast checks (fmt,
    # clippy, unit tests, cargo-deny) and a skipped required check counts
    # as satisfied. The full build matrix still runs on every PR head and
    # on main after each merge, so platform-build breakage surfaces there.
    if: github.event_name != 'merge_group'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            packages: "-p vouch-cli -p vouch-agent"
            install: brew install go
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Setup Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "release-${{ matrix.target }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set RUSTFLAGS # zizmor: ignore[template-injection] — static matrix value
        if: matrix.rustflags
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (Linux)
        if: runner.os == 'Linux'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: ci
        env:
          TARGET: ${{ matrix.target }}
          # Write the bake layer cache only from main: entries written from
          # PR/merge-queue refs are readable only by that ref and evict the
          # shared main-scoped cache. All refs still read main's cache.
          WRITE_CACHE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - name: Build # zizmor: ignore[template-injection] — static matrix values
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vouch-${{ matrix.name }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/vouch.exe
          retention-days: 7

  # Satisfies the required "Build (linux-amd64)" check in merge groups,
  # where the real build matrix is skipped. A job-level skip of a matrix
  # job never expands the matrix, so it reports one check literally named
  # "Build (${{ matrix.name }})" — the required name never reports and the
  # queue waits forever. This shim reports the exact required name and
  # exits immediately; its `if` is mutually exclusive with the build job's.
  build-merge-group-shim:
    name: Build (linux-amd64)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Build matrix runs on PR heads and main pushes; skipped in merge groups."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories sources

  scan:
    name: Security Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: vouch-server:scan
          cache-from: type=gha,scope=ci-scan
          cache-to: type=gha,mode=max,scope=ci-scan

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          image: 'vouch-server:scan'
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
