name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "fmt"
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_LC_FIPS_SYS_CC: clang
      AWS_LC_FIPS_SYS_CXX: clang++
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "clippy-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
            cargo-args: ""
            fips-cc: clang
            fips-cxx: clang++
          - name: macos
            runner: macos-latest
            install-deps: brew install go
            cargo-args: ""
          - name: windows
            runner: windows-latest
            install-deps: ""
            cargo-args: "--workspace --exclude vouch-server --exclude vouch-agent --exclude vouch-tests"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install-deps != ''
        env:
          INSTALL_DEPS: ${{ matrix.install-deps }}
        shell: bash
        run: ${INSTALL_DEPS}
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "debug-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Set FIPS compiler
        if: matrix.fips-cc
        env:
          FIPS_CC: ${{ matrix.fips-cc }}
          FIPS_CXX: ${{ matrix.fips-cxx }}
        run: |
          echo "AWS_LC_FIPS_SYS_CC=${FIPS_CC}" >> "$GITHUB_ENV"
          echo "AWS_LC_FIPS_SYS_CXX=${FIPS_CXX}" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          CARGO_ARGS: ${{ matrix.cargo-args }}
        shell: bash
        run: cargo test ${CARGO_ARGS}

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            packages: "-p vouch-cli -p vouch-agent"
            install: brew install go
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install != ''
        env:
          INSTALL_CMD: ${{ matrix.install }}
        shell: bash
        run: ${INSTALL_CMD}
      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          rustup show
          rustup target add "${TARGET}"
      - name: Setup Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "release-${{ matrix.target }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set RUSTFLAGS
        if: matrix.rustflags
        shell: bash
        env:
          RUSTFLAGS_VALUE: ${{ matrix.rustflags }}
        run: echo "RUSTFLAGS=${RUSTFLAGS_VALUE}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build (Linux)
        if: runner.os == 'Linux'
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          targets: ci
        env:
          TARGET: ${{ matrix.target }}
      - name: Build
        if: runner.os != 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ matrix.packages }}
        shell: bash
        run: cargo build --release --target "${TARGET}" ${PACKAGES}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check licenses advisories sources

  scan:
    name: Security Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image for scanning
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          load: true
          tags: vouch-server:scan
          cache-from: type=gha,scope=ci-scan
          cache-to: type=gha,mode=max,scope=ci-scan

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c # v7.3.2
        id: grype
        with:
          image: 'vouch-server:scan'
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
