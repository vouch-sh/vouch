name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "fmt"
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_LC_FIPS_SYS_CC: clang
      AWS_LC_FIPS_SYS_CXX: clang++
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "clippy-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
            cargo-args: ""
            fips-cc: clang
            fips-cxx: clang++
          - name: macos
            runner: macos-latest
            install-deps: brew install go
            cargo-args: ""
          - name: windows
            runner: windows-latest
            install-deps: ""
            cargo-args: "--workspace --exclude vouch-server --exclude vouch-agent --exclude vouch-tests"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "debug-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Set FIPS compiler # zizmor: ignore[template-injection] — static matrix values
        if: matrix.fips-cc
        run: |
          echo "AWS_LC_FIPS_SYS_CC=${{ matrix.fips-cc }}" >> "$GITHUB_ENV"
          echo "AWS_LC_FIPS_SYS_CXX=${{ matrix.fips-cxx }}" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo-args }} # zizmor: ignore[template-injection] — static matrix value

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            packages: "-p vouch-cli -p vouch-agent"
            install: brew install go
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Setup Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: "v2"
          shared-key: "release-${{ matrix.target }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set RUSTFLAGS # zizmor: ignore[template-injection] — static matrix value
        if: matrix.rustflags
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (Linux)
        if: runner.os == 'Linux'
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          targets: ci
        env:
          TARGET: ${{ matrix.target }}
      - name: Build # zizmor: ignore[template-injection] — static matrix values
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vouch-${{ matrix.name }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/vouch.exe
          retention-days: 7

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check licenses advisories sources

  scan:
    name: Security Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: vouch-server:scan
          cache-from: type=gha,scope=ci-scan
          cache-to: type=gha,mode=max,scope=ci-scan

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          image: 'vouch-server:scan'
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
