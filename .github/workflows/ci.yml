name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: "v2"
          shared-key: "fmt"
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      AWS_LC_FIPS_SYS_CC: clang
      AWS_LC_FIPS_SYS_CXX: clang++
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: "v2"
          shared-key: "clippy-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake golang-go clang
            cargo-args: ""
            fips-cc: clang
            fips-cxx: clang++
          - name: macos
            runner: macos-latest
            install-deps: brew install go
            cargo-args: ""
          - name: windows
            runner: windows-latest
            install-deps: ""
            cargo-args: "--workspace --exclude vouch-server --exclude vouch-agent --exclude vouch-tests"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }}
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: "v2"
          shared-key: "debug-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Set FIPS compiler
        if: matrix.fips-cc
        run: |
          echo "AWS_LC_FIPS_SYS_CC=${{ matrix.fips-cc }}" >> "$GITHUB_ENV"
          echo "AWS_LC_FIPS_SYS_CXX=${{ matrix.fips-cxx }}" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test ${{ matrix.cargo-args }}

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            packages: "-p vouch-cli -p vouch-agent"
            install: brew install go
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            packages: "-p vouch-cli"
            install: ""
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}
      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Setup Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: "v2"
          shared-key: "release-${{ matrix.target }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set RUSTFLAGS
        if: matrix.rustflags
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            rust:1.94.0-alpine sh -c '
              apk add --no-cache musl-dev openssl-dev openssl-libs-static pkgconfig cmake make go perl clang linux-headers eudev-dev
              export AWS_LC_FIPS_SYS_CC=clang
              export AWS_LC_FIPS_SYS_CXX=clang++
              export OPENSSL_STATIC=1
              export OPENSSL_LIB_DIR=/usr/lib
              export OPENSSL_INCLUDE_DIR=/usr/include
              rustup target add ${{ matrix.target }}
              cargo build --release --locked --target ${{ matrix.target }} -p vouch-cli -p vouch-agent -p vouch-server
            '
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.packages }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check licenses advisories sources

  scan:
    name: Security Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image for scanning
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          load: true
          tags: vouch-server:scan
          cache-from: type=gha,scope=ci-scan
          cache-to: type=gha,mode=max,scope=ci-scan

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c # v7.3.2
        id: grype
        with:
          image: 'vouch-server:scan'
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
