[package]
name = "vouch-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration tests for Vouch"
publish = false

# Allow panics in tests
[lints.clippy]
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"
indexing_slicing = "allow"

[lints.rust]
unsafe_code = "deny"

[dependencies]
vouch-common = { path = "../vouch-common", features = ["test-utils"] }
vouch-cli = { path = "../vouch-cli", features = ["test-utils"] }
vouch-server = { path = "../vouch-server", features = ["test-utils"] }
vouch-agent = { path = "../vouch-agent", features = ["test-utils"] }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
aws-lc-rs = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { version = "=1.9.0", default-features = false, features = ["std"] }
