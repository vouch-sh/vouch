[package]
name = "vouch-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Integration tests for Vouch"
publish.workspace = true

# Panic lints are relaxed per crate root; Cargo rejects local overrides here.
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
aws-lc-rs = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true, features = ["std"] }
ciborium = { workspace = true }
hex = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
jiff = { workspace = true, features = ["std", "serde", "tz-system"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "prefer-post-quantum", "tls12"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v7", "serde", "std"] }
vouch-agent = { path = "../vouch-agent", features = ["test-utils"] }
vouch-cli = { path = "../vouch-cli", features = ["test-utils"] }
vouch-common = { path = "../vouch-common" }
vouch-httpsig = { workspace = true }
vouch-server = { path = "../vouch-server", features = ["test-utils"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
urlencoding = { workspace = true }
