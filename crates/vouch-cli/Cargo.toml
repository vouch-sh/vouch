[package]
name = "vouch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware-backed identity for developers"
readme = "../../README.md"

[lints]
workspace = true

[features]
default = []
test-utils = ["vouch-common/test-utils", "ed25519-dalek/rand_core", "axum", "tower", "http"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch"
path = "src/main.rs"

[dependencies]
vouch-common = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { version = "=4.5.66", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctap-hid-fido2 = { version = "=3.5.8", default-features = false }
rpassword = { version = "=7.4.0", default-features = false }
inquire = { version = "=0.9.3", default-features = false, features = ["crossterm"] }
dirs = { workspace = true }
open = { version = "=5.3.3", default-features = false }
base64 = { workspace = true }
aws-lc-rs = { workspace = true }
jiff = { workspace = true }
url = { workspace = true }
ssh-key = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
zeroize = { version = "=1.8.2", default-features = false, features = ["derive"] }
serde_urlencoded = { version = "=0.7.1", default-features = false }
serde_yaml = { version = "=0.9.34", default-features = false }
rust-ini = { version = "=0.21.3", default-features = false }
toml_edit = { version = "=0.25.1", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
vouch-agent = { workspace = true }
libc = { workspace = true }

# Optional dependencies for test-utils feature
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
