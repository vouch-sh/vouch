[package]
name = "vouch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware-backed identity for developers"
readme = "../../README.md"

[lints]
workspace = true

[features]
default = []
test-utils = ["vouch-common/test-utils", "ed25519-dalek/rand_core", "rand_core", "axum", "tower", "http"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch"
path = "src/main.rs"

[dependencies]
vouch-common = { workspace = true }
vouch-agent = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctap-hid-fido2 = { workspace = true }
rpassword = { workspace = true }
inquire = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
aws-lc-rs = { workspace = true }
jiff = { workspace = true }
url = { workspace = true }
ssh-key = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
rand_core = { version = "0.6", optional = true }
serde_urlencoded = "0.7"
libc = "0.2"

# Optional dependencies for test-utils feature
axum = { workspace = true, optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
http = { version = "1", optional = true }
