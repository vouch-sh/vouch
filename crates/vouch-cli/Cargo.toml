[package]
name = "vouch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hardware-backed identity for developers"
readme = "../../README.md"

[lints]
workspace = true

[features]
test-utils = ["ed25519-dalek/rand_core", "axum", "tower"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
ciborium = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context"] }
clap_complete = { workspace = true }
dirs = { workspace = true }
gethostname = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
i18n-embed = { workspace = true, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = { workspace = true }
inquire = { workspace = true, features = ["crossterm"] }
jiff = { workspace = true, features = ["std", "serde", "tz-system"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
keyring-core = { workspace = true }
mimalloc = { workspace = true, features = ["secure"] }
open = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "form", "query"] }
roxmltree = { workspace = true, features = ["std"] }
rpassword = { workspace = true }
rust-embed = { workspace = true }
rust-ini = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
sys-locale = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_urlencoded = { workspace = true }
serde_yaml = { workspace = true }
ssh-key = { workspace = true, features = ["std", "ed25519", "encryption", "rand_core", "getrandom"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
toml_edit = { workspace = true, features = ["parse", "display"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter"] }
url = { workspace = true }
unic-langid = { workspace = true, features = ["macros"] }
uuid = { workspace = true, features = ["v7"] }
vouch-common = { workspace = true }
vouch-httpsig = { workspace = true }
vouch-i18n = { workspace = true }
which = { workspace = true, features = ["real-sys"] }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aws-lc-rs = { workspace = true, features = ["fips"] }
ctap-hid-fido2 = { workspace = true, features = ["fips"] }
linux-keyutils-keyring-store = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }
ctap-hid-fido2 = { workspace = true, features = ["aws-lc-rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Console",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
aws-lc-rs = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
vouch-agent = { workspace = true }

# Optional dependencies for test-utils feature
[dependencies.axum]
workspace = true
features = ["json", "tokio", "http1", "form", "query"]
optional = true

[dependencies.http]
workspace = true
features = ["std"]

[dependencies.tower]
workspace = true
features = ["util"]
optional = true

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
