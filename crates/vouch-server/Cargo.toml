[package]
name = "vouch-server"
version.workspace = true
edition.workspace = true
license = "BUSL-1.1"
description = "Vouch identity server"

[lints]
workspace = true

[features]
default = []
test-utils = ["vouch-common/test-utils", "tower"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch-server"
path = "src/main.rs"

[dependencies]
vouch-common = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { version = "=0.12.5", default-features = false, features = ["cookie", "typed-header"] }
headers = { version = "=0.4.1", default-features = false }
time = { version = "=0.3.47", default-features = false }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "migrate", "derive", "macros", "sqlite", "postgres", "tls-rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
aws-lc-rs = { workspace = true }
ed25519-dalek = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { version = "=0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = { version = "=0.5.4", default-features = false }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
jiff = { workspace = true }
jiff-sqlx = { version = "0.1", default-features = false, features = ["postgres", "sqlite"] }
base64 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
urlencoding = { version = "=2.1.3", default-features = false }
reqwest = { workspace = true }
secrecy = { workspace = true }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.2", default-features = false }
clap = { workspace = true }
dotenvy = { version = "=0.15.7", default-features = false }
askama = { version = "=0.15.4", default-features = false, features = ["derive", "config", "alloc"] }
tower-http = { version = "=0.6.8", default-features = false, features = ["cors", "fs"] }
ssh-key = { workspace = true }
tower = { workspace = true, optional = true }
sea-query = { version = "=0.32.7", default-features = false, features = ["backend-sqlite", "backend-postgres", "derive"] }

# AWS SDK for DSQL token generation, credential loading, and S3 config
aws-config = { version = "=1.8.13", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "sso", "rustls"] }
aws-sdk-dsql = { version = "=1.50.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "rustls"] }
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "rustls"] }

# Lock-free atomic config updates
arc-swap = { version = "=1.8.1", default-features = false }

# Optional TLS termination
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls"] }
rustls-pemfile = { version = "=2.2.0", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { workspace = true }
