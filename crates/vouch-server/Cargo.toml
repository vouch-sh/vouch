[package]
name = "vouch-server"
version.workspace = true
edition.workspace = true
license = "BUSL-1.1"
description = "Vouch identity server"

[lints]
workspace = true

[features]
default = []
test-utils = ["tower"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
arc-swap = { workspace = true }
askama = { workspace = true, features = ["derive", "config", "alloc"] }
aws-config = { workspace = true, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "sso"] }
aws-lc-rs = { workspace = true, features = ["fips"] }
aws-sdk-dsql = { workspace = true, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-kms = { workspace = true, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-s3 = { workspace = true, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-smithy-types = { workspace = true }
axum = { workspace = true, features = ["json", "tokio", "http1", "http2", "form", "original-uri", "query"] }
axum-extra = { workspace = true, features = ["cookie", "typed-header"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
base64 = { workspace = true, features = ["std"] }
cel = { workspace = true }
ciborium = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context"] }
dotenvy = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
governor = { workspace = true, features = ["std"] }
headers = { workspace = true }
hex = { workspace = true, features = ["std"] }
http = { workspace = true }
jiff = { workspace = true, features = ["std", "serde", "tz-system"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
mime_guess = { workspace = true }
mimalloc = { workspace = true, features = ["secure"] }
p256 = { workspace = true, features = ["ecdsa"] }
reqwest = { workspace = true, features = ["json", "rustls", "form"] }
rust-embed = { workspace = true, features = ["axum-ex", "deterministic-timestamps", "mime-guess"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "prefer-post-quantum"] }
rustls-pemfile = { workspace = true, features = ["std"] }
sea-query = { workspace = true, features = ["backend-sqlite", "backend-postgres", "derive"] }
sea-query-binder = { workspace = true, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "migrate", "derive", "macros", "sqlite", "postgres", "tls-rustls-aws-lc-rs"] }
signature = { workspace = true }
spki = { workspace = true, features = ["std"] }
ssh-key = { workspace = true, features = ["std", "ed25519", "encryption", "rand_core", "getrandom"] }
subtle = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"], optional = true }
tower-http = { workspace = true, features = ["cors", "request-id", "set-header", "timeout"] }
tower_governor = { workspace = true, features = ["axum"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "std"] }
vouch-common = { workspace = true }
webauthn-rs = { workspace = true, features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
