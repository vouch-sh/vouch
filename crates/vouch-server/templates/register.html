<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>vouch - Register Authenticator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 32px; }
        .code { 
            font-family: monospace; 
            font-size: 32px; 
            letter-spacing: 4px;
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
        }
        .status {
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
        }
        .status.waiting { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .icon { font-size: 48px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="icon">🔐</div>
    <h1>vouch</h1>
    <p class="subtitle">Register your authenticator</p>
    
    <div class="code">{{CODE}}</div>
    
    <div id="status" class="status waiting">
        Ready to register
    </div>
    
    <button id="register-btn" onclick="startRegistration()">
        Register with YubiKey or Touch ID
    </button>

    <script>
        const code = '{{CODE}}';
        const rpId = '{{RP_ID}}';
        
        async function startRegistration() {
            const btn = document.getElementById('register-btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.className = 'status waiting';
            status.textContent = 'Starting registration...';
            
            try {
                // Get registration options from server
                const optionsRes = await fetch('/api/webauthn/register/options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                
                if (!optionsRes.ok) {
                    throw new Error('Failed to get registration options');
                }
                
                const options = await optionsRes.json();
                
                // Convert base64 to ArrayBuffer
                options.publicKey.challenge = base64ToBuffer(options.publicKey.challenge);
                options.publicKey.user.id = base64ToBuffer(options.publicKey.user.id);
                
                status.textContent = 'Touch your YubiKey or use Touch ID...';
                
                // Create credential
                const credential = await navigator.credentials.create(options);
                
                status.textContent = 'Verifying...';
                
                // Send to server
                const verifyRes = await fetch('/api/webauthn/register/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        id: credential.id,
                        rawId: bufferToBase64(credential.rawId),
                        type: credential.type,
                        response: {
                            clientDataJSON: bufferToBase64(credential.response.clientDataJSON),
                            attestationObject: bufferToBase64(credential.response.attestationObject)
                        }
                    })
                });
                
                if (!verifyRes.ok) {
                    throw new Error('Registration verification failed');
                }
                
                status.className = 'status success';
                status.textContent = '✓ Registration complete! You can close this window.';
                btn.textContent = 'Done';
                
            } catch (err) {
                console.error(err);
                status.className = 'status error';
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'Try Again';
            }
        }
        
        function base64ToBuffer(base64) {
            const binary = atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }
        
        function bufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }
    </script>
</body>
</html>
