{% extends "admin_base.html" %}

{% block title %}Unauthorized{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div class="card text-center">
    <h1 class="text-2xl font-bold text-vouch-error mb-4">Unauthorized</h1>
    <p class="text-gray-400 mb-4">You need a valid admin token to access this page.</p>
    <p class="text-sm text-gray-500">
        Set <code class="bg-vouch-raised px-2 py-1 rounded text-gray-300">VOUCH_ADMIN_BOOTSTRAP_TOKEN</code> and visit<br>
        <code class="bg-vouch-raised px-2 py-1 rounded text-gray-300">/admin/setup?token=YOUR_TOKEN</code>
    </p>
</div>
{% endblock %}
