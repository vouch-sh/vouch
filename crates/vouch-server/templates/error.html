{% extends "base.html" %}

{% block title %}Vouch - Error{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen p-5">
    <div class="card max-w-md w-full text-center">
        <div class="text-6xl mb-4">&#x274C;</div>
        <h1 class="text-2xl font-bold text-red-600 mb-2">{{ title }}</h1>
        <p class="text-gray-600">{{ message }}</p>

        {% if let Some(url) = back_url %}
        <a href="{{ url }}" class="btn-primary mt-6 inline-block">Back</a>
        {% endif %}
    </div>
</div>
{% endblock %}
