<!DOCTYPE html>
<html lang="en" class="{% block html_class %}{% endblock %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/output.css">
    <title>{% block title %}Vouch{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen flex flex-col bg-vouch-bg text-gray-300{% endblock %}">
    <main class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </main>
    <footer class="py-6 text-center text-xs text-gray-500">
        <a href="/about" class="text-vouch-accent hover:text-vouch-accent-hover">About</a>
        <span class="mx-2">&middot;</span>
        <a href="/install" class="text-vouch-accent hover:text-vouch-accent-hover">Install</a>
        <span class="mx-2">&middot;</span>
        <a href="/privacy" class="text-vouch-accent hover:text-vouch-accent-hover">Privacy</a>
        <span class="mx-2">&middot;</span>
        <a href="/terms" class="text-vouch-accent hover:text-vouch-accent-hover">Terms</a>
        <div class="mt-2">Copyright 2026 Smoke Turner, LLC</div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
