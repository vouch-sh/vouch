<!DOCTYPE html>
<html lang="en" class="{% block html_class %}{% endblock %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/output.css">
    <title>{% block title %}Vouch{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="/static/images/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#0f1b2d">

    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block description %}Hardware-backed authentication with short-lived credentials. No credential issuance without human presence proof.{% endblock %}">
    <meta name="keywords" content="authentication, FIDO2, YubiKey, SSH, security, hardware key">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Vouch{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Hardware-backed authentication with short-lived credentials.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}/static/images/logo-512.png{% endblock %}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% block twitter_title %}Vouch{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Hardware-backed authentication with short-lived credentials.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}/static/images/logo-512.png{% endblock %}">

    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen flex flex-col bg-vouch-bg text-gray-300{% endblock %}">
    <header class="px-4 py-3 border-b border-vouch-border flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-gray-200 hover:text-white">
            <svg class="w-6 h-6 text-vouch-accent" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
            </svg>
            <span class="font-semibold">Vouch</span>
        </a>
        {% block header_right %}{% endblock %}
    </header>
    <main class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </main>
    <footer class="py-6 text-center text-xs text-gray-500">
        <a href="/install" class="text-vouch-accent hover:text-vouch-accent-hover">Install</a>
        <span class="mx-2">&middot;</span>
        <a href="https://vouch.sh/docs/" class="text-vouch-accent hover:text-vouch-accent-hover">Docs</a>
        <span class="mx-2">&middot;</span>
        <a href="https://github.com/vouch-sh/vouch" target="_blank" rel="noopener noreferrer" class="text-vouch-accent hover:text-vouch-accent-hover">GitHub</a>
        <span class="mx-2">&middot;</span>
        <a href="https://vouch.sh/privacy/" class="text-vouch-accent hover:text-vouch-accent-hover">Privacy</a>
        <span class="mx-2">&middot;</span>
        <a href="https://vouch.sh/terms/" class="text-vouch-accent hover:text-vouch-accent-hover">Terms</a>
        <div class="mt-2">Copyright 2026 Smoke Turner, LLC</div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
