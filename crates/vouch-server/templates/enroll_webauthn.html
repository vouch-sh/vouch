{% extends "base.html" %}

{% block title %}Vouch - Register Security Key{% endblock %}

{% block content %}
<div class="flex items-center justify-center flex-1 p-5">
    <div class="card max-w-md w-full text-center">
        <svg class="w-8 h-8 text-vouch-accent mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
        <h1 class="text-2xl font-bold text-gray-200 mb-2">Register Security Key</h1>
        <p class="text-gray-400 text-sm mb-6">Registering as <span class="font-semibold text-gray-300">{{ email }}</span></p>

        <div id="status" class="status-waiting mb-6">Click the button below, then touch your security key when it blinks.</div>

        <button id="register-btn" onclick="startRegistration()" class="btn-primary">Register Security Key</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const stateToken = '{{ state }}';
    const rpId = '{{ rp_id }}';

    async function startRegistration() {
        const btn = document.getElementById('register-btn');
        const status = document.getElementById('status');
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        status.className = 'status-waiting mb-6';
        status.textContent = 'Touch your security key when it blinks...';

        try {
            // Get registration options
            const startResp = await fetch('/enroll/webauthn/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oidc_state: stateToken })
            });

            if (!startResp.ok) {
                const err = await startResp.json();
                throw new Error(err.message || 'Failed to start registration');
            }

            const options = await startResp.json();

            // Convert base64url to ArrayBuffer
            const challenge = base64urlToBuffer(options.challenge);
            const userId = base64urlToBuffer(options.user_id);

            // Build excludeCredentials to prevent duplicate registrations
            const excludeCredentials = (options.exclude_credential_ids || []).map(id => ({
                type: 'public-key',
                id: base64urlToBuffer(id),
                transports: ['usb', 'nfc']
            }));

            // Create credential
            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge: challenge,
                    rp: { id: options.rp_id, name: options.rp_name },
                    user: {
                        id: userId,
                        name: options.user_email,
                        displayName: options.user_display_name
                    },
                    pubKeyCredParams: options.algorithms.map(alg => ({
                        type: 'public-key',
                        alg: alg
                    })),
                    authenticatorSelection: {
                        authenticatorAttachment: 'cross-platform',
                        userVerification: 'required',
                        residentKey: 'required'
                    },
                    excludeCredentials: excludeCredentials,
                    timeout: 60000,
                    attestation: 'direct'
                }
            });

            // Send credential to server
            const attestationResponse = credential.response;
            const completeResp = await fetch('/enroll/webauthn/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    state: options.state,
                    credential_id: bufferToBase64url(credential.rawId),
                    attestation_object: bufferToBase64url(attestationResponse.attestationObject),
                    client_data_json: bufferToBase64url(attestationResponse.clientDataJSON)
                })
            });

            if (!completeResp.ok) {
                const err = await completeResp.json();
                throw new Error(err.message || 'Failed to complete registration');
            }

            status.className = 'status-success mb-6';
            status.textContent = 'Success! You can close this window and return to your terminal.';
            btn.style.display = 'none';

        } catch (err) {
            status.className = 'status-error mb-6';

            // Provide user-friendly error messages for common WebAuthn errors
            let message = err.message;
            if (err.name === 'InvalidStateError') {
                message = 'This security key is already registered. Please use a different key.';
            } else if (err.name === 'NotAllowedError') {
                message = 'Registration was cancelled or timed out. Please try again.';
            } else if (err.name === 'NotSupportedError') {
                message = 'This security key is not supported. Please use a FIDO2-compatible key.';
            } else if (err.name === 'SecurityError') {
                message = 'Security error. Please ensure you are on a secure (HTTPS) connection.';
            } else if (err.name === 'AbortError') {
                message = 'Registration was cancelled.';
            } else if (err.message && err.message.toLowerCase().includes('pin')) {
                message = 'PIN error. Please ensure your security key has a PIN configured and try again.';
            }

            status.textContent = 'Error: ' + message;
            btn.disabled = false;
            btn.classList.remove('opacity-60', 'cursor-not-allowed');
        }
    }

    function base64urlToBuffer(base64url) {
        const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = base64.length % 4;
        const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
</script>
{% endblock %}
