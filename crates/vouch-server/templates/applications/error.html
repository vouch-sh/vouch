{% extends "base.html" %}

{% block title %}{{ title }} - Vouch{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6">
    <div class="bg-vouch-surface border border-vouch-border rounded-lg p-6">
        <div class="text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-vouch-error-bg">
                <svg class="h-6 w-6 text-vouch-error" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </div>
            <h1 class="mt-3 text-xl font-bold text-gray-200">{{ title }}</h1>
            <p class="mt-2 text-gray-400">{{ message }}</p>
        </div>

        <div class="mt-6 flex justify-center">
            <a href="{{ back_url }}" class="px-6 py-2 bg-vouch-accent hover:bg-vouch-accent-hover text-white rounded-md text-sm font-medium transition-colors">
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
