{% extends "base.html" %}

{% block title %}{{ title }} - Vouch{% endblock %}

{% block body_class %}min-h-screen bg-gray-100{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </div>
            <h1 class="mt-3 text-xl font-bold text-gray-900">{{ title }}</h1>
            <p class="mt-2 text-gray-600">{{ message }}</p>
        </div>

        <div class="mt-6 flex justify-center">
            <a href="{{ back_url }}" class="px-6 py-2 bg-vouch-600 hover:bg-vouch-700 text-white rounded-md text-sm font-medium">
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
