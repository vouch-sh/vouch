{% extends "base.html" %}

{% block title %}Vouch - Device Verification{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen p-5">
    <div class="card max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Enter Your Code</h1>
        <p class="text-gray-600 text-sm mb-6">Enter the code shown in your terminal to continue.</p>

        {% if let Some(err) = error %}
        <div class="alert-error mb-4">{{ err }}</div>
        {% endif %}

        <form method="POST" action="/device">
            <input type="text" name="user_code" placeholder="XXXX-XXXX" maxlength="9" required autofocus class="input-code mb-4">
            <button type="submit" class="btn-primary w-full">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
