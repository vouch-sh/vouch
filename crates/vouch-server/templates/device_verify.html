{% extends "base.html" %}

{% block title %}{{ self.tr("device-page-title") }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center flex-1 p-5">
    <div class="card max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-200 mb-2">{{ self.tr("device-heading") }}</h1>
        <p class="text-gray-400 text-sm mb-6">{{ self.tr("device-body") }}</p>

        {% if let Some(err) = error %}
        <div class="alert-error mb-4" role="alert">{{ err }}</div>
        {% endif %}

        <form method="POST" action="/device">
            <label for="user_code" class="sr-only">{{ self.tr("device-code-label") }}</label>
            <input type="text" id="user_code" name="user_code" placeholder="XXXX-XXXX" maxlength="9" required autofocus
                   {% if let Some(code) = user_code %}value="{{ code }}"{% endif %}
                   autocomplete="one-time-code" autocorrect="off" autocapitalize="characters" spellcheck="false"
                   class="input-code mb-4">
            <button type="submit" class="btn-primary w-full">{{ self.tr("device-continue") }}</button>
        </form>
    </div>
</div>
{% endblock %}
