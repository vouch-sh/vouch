{% extends "base.html" %}

{% block title %}Sign in - Vouch{% endblock %}

{% block content %}
<div class="flex items-center justify-center flex-1 p-5">
    <div class="card max-w-md w-full text-center">
        <svg class="w-8 h-8 text-vouch-accent mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
        <h1 class="text-2xl font-bold text-gray-200 mb-2">Sign in to continue</h1>
        <p class="text-gray-400 text-sm mb-6">Hardware authentication required</p>

        <div class="bg-vouch-raised rounded-lg p-4 mb-6 text-left">
            <strong class="text-gray-300">{{ client_id }}</strong>
            <p class="text-gray-400 text-sm mt-1">wants to access your Vouch identity</p>
        </div>

        <div class="bg-vouch-warning-bg border-l-4 border-vouch-warning p-4 rounded-r-lg text-left">
            <p class="text-gray-300 text-sm">Use the Vouch CLI to authenticate:</p>
            <div class="code-block mt-2 text-sm">vouch login</div>
            <p class="text-gray-400 text-xs mt-3">Then refresh this page.</p>
        </div>
    </div>
</div>
{% endblock %}
