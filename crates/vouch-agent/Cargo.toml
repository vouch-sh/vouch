[package]
name = "vouch-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vouch local credential agent daemon"

[lints]
workspace = true

[features]
default = []
test-utils = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "vouch-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions", "color"] }
ed25519-dalek = { workspace = true }
i18n-embed = { workspace = true, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = { workspace = true }
jiff = { workspace = true, features = ["std", "serde", "tz-system"] }
mimalloc = { workspace = true, features = ["secure"] }
rust-embed = { workspace = true }
# Direct dependency only to enable prefer-post-quantum: reqwest builds its rustls
# ClientConfig from the default provider, and this feature makes X25519MLKEM768 the
# preferred key-exchange group for all outbound TLS.
rustls = { workspace = true, features = ["aws-lc-rs", "std", "prefer-post-quantum", "tls12"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
ssh-key = { workspace = true, features = ["std", "ed25519", "encryption", "rand_core", "getrandom"] }
sys-locale = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter"] }
unic-langid = { workspace = true, features = ["macros"] }
url = { workspace = true }
vouch-common = { path = "../vouch-common" }
vouch-i18n = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
