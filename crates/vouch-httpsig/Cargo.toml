[package]
name = "vouch-httpsig"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RFC 9421 HTTP Message Signatures and RFC 9530 Digest Fields"

[lints]
workspace = true

[features]
default = []
axum = ["dep:axum", "dep:tracing"]

[dependencies]
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"] }
axum = { workspace = true, features = ["tokio", "matched-path"], optional = true }
base64 = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
jiff = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
