# Include the dracut FIPS module so the initramfs enforces FIPS mode during
# early boot (kernel fips=1 is set via kernelcmdline in appliance.kiwi).
# If the module's kernel HMAC check turns out to be incompatible with the UKI
# layout, drop this file: file integrity is independently enforced by Secure
# Boot UKI signing and dm-verity (panic-on-corruption), and the kernel still
# runs its FIPS self-tests with fips=1.
add_dracutmodules+=" fips "
